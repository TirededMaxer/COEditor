name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coeditor-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  app:
    name: App, tests and DMG
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check clean Apple Silicon environment
        run: |
          test "$(uname -m)" = arm64
          test ! -d build
          xcodebuild -version
          xcrun swiftc --version
      - name: Build and test debug and release
        run: |
          for mode in debug release; do
            ./scripts/build-app.sh "$mode"
            "build/$mode/COEditor.app/Contents/MacOS/CrossOverTuner" --self-test
            "build/$mode/COEditor.app/Contents/MacOS/CrossOverTuner" --library-test
          done
          ./scripts/test-native.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package and verify DMG
        run: |
          ./scripts/build-dmg.sh
          python3 scripts/verify-dmg.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: COEditor-macOS-arm64-${{ github.sha }}
          path: |
            build/*.dmg
            build/SHA256SUMS
            build/BUILDINFO.json
          if-no-files-found: error
          retention-days: 7

  wine:
    name: Clean Wine and D3D11 components
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      JOBS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          brew install bison flex llvm lld freetype molten-vk
          for tool in bison flex llvm lld; do
            echo "$(brew --prefix "$tool")/bin" >> "$GITHUB_PATH"
          done
      - name: Download and verify official source
        run: |
          test "$(uname -m)" = x86_64
          python3 scripts/fetch-wine-source.py "$RUNNER_TEMP/coeditor-wine-source"
      - name: Build and package Wine components from scratch
        run: ./scripts/build-wine-clean.sh "$RUNNER_TEMP/coeditor-wine-source" "$RUNNER_TEMP/coeditor-wine-build"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: COEditor-Wine-26.3-x86_64-${{ github.sha }}
          path: build/COEditor-Wine-26.3-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish verified release
    needs: [app, wine]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: COEditor-macOS-arm64-${{ github.sha }}
          path: dist
      - name: Publish, download-verify, then remove old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --tag "$GITHUB_REF_NAME" --directory dist
